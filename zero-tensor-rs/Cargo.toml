[package]
name = "zero-tensor-lib"
version = "0.6.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
crossbeam-utils = "0.8.22"
ctrlc = "3.5.2"
fast_image_resize = { version = "6.1.0", features = ["image"] }
fastrand = "2.5.0"
half = { version = "2.7.1", features = ["bytemuck"] }
indexmap = "2.14.0"
libc = "0.2.186"
memmap2 = "0.9.11"
ndarray = { version = "0.17.2", features = ["rayon"] }
parking_lot = "0.12.5"
rand = "0.10.2"
rayon = "1.12.0"
smallvec = "1.15.2"
thiserror = "2.0.18"
turbojpeg = "1.5.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.10"
rstest = "0.26.1"
dirs = "6.0.0"
tar = "0.4.46"
